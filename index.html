<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Guard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d2d1f;
        background: #edf7ee;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: linear-gradient(180deg, #f5fbf5 0%, #e8f4ea 100%);
      }

      .app {
        width: min(100%, 520px);
        background: #ffffff;
        border: 1px solid #dfece0;
        border-radius: 18px;
        box-shadow: 0 18px 40px rgba(32, 66, 42, 0.08);
        padding: 28px 24px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.1;
      }

      .status {
        padding: 8px 12px;
        border-radius: 999px;
        background: #eaf8eb;
        color: #1f6f36;
        font-size: 0.8rem;
        font-weight: 700;
      }

      .card {
        background: #f7faf7;
        border: 1px solid #e0ece1;
        border-radius: 14px;
        padding: 18px 16px;
      }

      .label {
        margin: 0 0 8px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5d7a60;
      }

      .value {
        margin: 0;
        font-size: 1.8rem;
        font-weight: 700;
      }

      .note {
        margin-top: 16px;
        color: #516a59;
        font-size: 0.95rem;
      }
    </style>
  </head>
  <body>
    <main class="app">
      <div class="topbar">
        <h1>Garden Guard</h1>
        <div class="status">Healthy</div>
      </div>

      <section class="card">
        <p class="label">Garden status</p>
        <p class="value">All good</p>
      </section>

      <p class="note">Your garden is looking strong and ready for the day.</p>
    </main>
  </body>
</html>
