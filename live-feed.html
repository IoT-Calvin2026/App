<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Feed | Garden Guard</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        color: #18352a;
        background: #edf4ec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: start center;
        padding: 64px 24px 24px;
        background:
          radial-gradient(circle at 15% 10%, rgba(220, 238, 215, 0.9), transparent 34%),
          linear-gradient(145deg, #f8fbf5 0%, #e6f0e5 100%);
      }

      .page {
        width: min(100%, 680px);
        padding: 30px 26px 26px;
        border: 1px solid #d7e5d4;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 20px 45px rgba(32, 66, 42, 0.1);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 22px;
        border-bottom: 1px solid #e4ede2;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 6vw, 2.6rem);
        font-weight: 600;
        line-height: 1.1;
      }

      .back-link {
        color: #5e8f5b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        font-weight: 700;
        text-decoration: none;
      }

      .back-link:hover {
        color: #234936;
        text-decoration: underline;
      }

      .camera-frame {
        width: 100%;
        aspect-ratio: 16 / 9;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 26px;
        border: 1px solid #c9dcc8;
        border-radius: 8px;
        background: #eaf4e8;
        color: #5e8f5b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.9rem;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      .camera-center {
        opacity: 0.75;
      }

      .camera-topline,
      .camera-bottomline {
        position: absolute;
        left: 14px;
        right: 14px;
        display: flex;
        justify-content: space-between;
        color: #234936;
        font: 700 0.7rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .camera-topline { top: 12px; }
      .camera-bottomline { bottom: 12px; }

      .camera-live { color: #b65745; }

      .status {
        margin: 14px 0 0;
        color: #6b856d;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.85rem;
        text-align: center;
      }

      .photos {
        margin-top: 30px;
        padding-top: 24px;
        border-top: 1px solid #e4ede2;
      }

      .photos-heading {
        margin: 0 0 12px;
        color: #234936;
        font-size: 1.15rem;
      }

      .photo-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }

      .photo-placeholder {
        aspect-ratio: 4 / 3;
        display: grid;
        place-items: center;
        border: 1px solid #c9dcc8;
        border-radius: 8px;
        background: #eaf4e8;
        color: #5e8f5b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      @media (max-width: 480px) {
        .page {
          padding: 24px 18px 20px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <h1>Live Feed</h1>
        <a class="back-link" href="index.html">Back
        </a>
      </div>
      <div class="camera-frame" role="img" aria-label="Live camera feed placeholder">
        <span class="camera-topline"><span>Backyard camera</span><span class="camera-live">● Live</span></span>
        <span class="camera-center">Camera feed placeholder</span>
        <span class="camera-bottomline"><span>12:42 PM</span><span>Motion clear</span></span>
      </div>
      <p class="status">Camera connection ready for a live stream.</p>
      <section class="photos" aria-label="Photo placeholders">
        <h2 class="photos-heading">Photos</h2>
        <div class="photo-grid">
          <div class="photo-placeholder" role="img" aria-label="Photo placeholder 1">Photo 1</div>
          <div class="photo-placeholder" role="img" aria-label="Photo placeholder 2">Photo 2</div>
          <div class="photo-placeholder" role="img" aria-label="Photo placeholder 3">Photo 3</div>
        </div>
      </section>
    </main>
  </body>
</html>
