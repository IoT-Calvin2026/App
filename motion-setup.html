<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Motion Detector | Garden Guard</title>
    <style>
      :root { font-family: Georgia, "Times New Roman", serif; color: #18352a; background: #edf4ec; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: start center; padding: 64px 24px 24px; background: linear-gradient(145deg, #fbfcf8 0%, #e5f0e3 100%); }
      .page { width: min(100%, 560px); padding: 32px 28px 28px; border: 1px solid #d7e5d4; border-radius: 18px; background: #fff; box-shadow: 0 24px 55px rgba(32, 66, 42, .13); }
      h1 { margin: 0; padding-bottom: 24px; border-bottom: 1px solid #e4ede2; font-size: clamp(1.8rem, 6vw, 2.6rem); font-weight: 500; text-align: center; }
      .intro { margin: 24px 0 18px; color: #6b856d; font: .9rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .progress { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 22px; }
      .progress-step { padding: 8px 4px; border-radius: 6px; background: #eaf4e8; color: #5e8f5b; font: 700 .68rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      .progress-step.active { background: #5e8f5b; color: #fff; }
      form { display: grid; gap: 14px; }
      label { display: grid; gap: 6px; color: #234936; font-weight: 700; }
      input, select { width: 100%; min-height: 44px; padding: 0 10px; border: 1px solid #c9dcc8; border-radius: 7px; background: #f7fbf5; color: #234936; font: .88rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      small { color: #6b856d; font: .76rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-weight: 400; }
      .actions { display: flex; justify-content: space-between; gap: 10px; margin-top: 6px; }
      button, a { min-height: 42px; display: inline-flex; align-items: center; justify-content: center; padding: 0 14px; border: 1px solid #c9dcc8; border-radius: 7px; background: #f7fbf5; color: #234936; font: .85rem Georgia, "Times New Roman", serif; text-decoration: none; cursor: pointer; }
      button:hover, a:hover { border-color: #79a477; background: #eef7eb; }
      .primary { background: #dcebd8; }
      @media (max-width: 480px) { body { padding: 32px 16px 16px; } .page { padding: 24px 18px 20px; } .actions { flex-direction: column-reverse; } }
    </style>
  </head>
  <body>
    <main class="page">
      <h1>Connect Motion Detector</h1>
      <div class="progress" aria-label="Connection progress"><span class="progress-step active">1. Details</span><span class="progress-step">2. Connect</span><span class="progress-step">3. Ready</span></div>
      <p class="intro">Set up movement alerts for a specific garden area.</p>
      <form id="setup-form">
        <label>Detector name<input type="text" placeholder="Garden gate detector" required /></label>
        <label>Detector ID<input type="text" placeholder="MOTION-1182" required /><small>Find this ID on the detector label.</small></label>
        <label>Monitored area<select><option>Garden gate</option><option>Greenhouse</option><option>Backyard beds</option></select></label>
        <div class="actions"><a href="index.html">Back to Garden Guard</a><button class="primary" type="submit">Attach detector</button></div>
      </form>
    </main>
    <script>document.querySelector("#setup-form").addEventListener("submit", (event) => { event.preventDefault(); const button = event.target.querySelector("button"); button.textContent = "Connecting..."; setTimeout(() => { button.textContent = "Detector attached"; }, 700); });</script>
  </body>
</html>
