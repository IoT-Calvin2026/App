<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Feed | Garden Guard</title>
    <link rel="stylesheet" href="styles/live-feed.css" />
  </head>
  <body>
    <main class="page">
      <div class="topbar">
        <h1>Live Feed</h1>
        <a class="back-link" href="index.html">Back</a>
      </div>
      <div
        class="camera-frame"
        aria-label="Live backyard camera feed"
      >
        <img
          class="camera-stream"
          src="http://153.106.82.220:8000/stream.mjpg"
          alt="Live backyard camera feed"
        />
        <span class="camera-topline">
          <span>Backyard camera</span>
          <span class="camera-live">● Live</span>
        </span>
        <span class="camera-bottomline">
          <time data-local-time>--:--</time>
          <span>Motion clear</span>
        </span>
      </div>
      <p class="status">Live camera stream</p>
      <section class="photos" aria-label="Photo placeholders">
        <h2 class="photos-heading">Photos</h2>
        <div class="photo-grid">
          <div
            class="photo-placeholder"
            role="img"
            aria-label="Photo placeholder 1"
          >
            Photo 1
          </div>
          <div
            class="photo-placeholder"
            role="img"
            aria-label="Photo placeholder 2"
          >
            Photo 2
          </div>
          <div
            class="photo-placeholder"
            role="img"
            aria-label="Photo placeholder 3"
          >
            Photo 3
          </div>
        </div>
      </section>
    </main>
    <script src="javascript/live-feed.js"></script>
  </body>
</html>
